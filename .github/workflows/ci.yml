name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push supersedes the first; no point burning minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (front end)
        run: npm run test:web

      # The reason this workflow exists. Vercel refused a deploy over a Next.js
      # CVE that nothing in the repo would otherwise have caught.
      #
      # Gates on what ships. Dev tooling is reported but not blocking: in
      # October 2026 `braces` (pulled in by eslint-config-next) gained a high
      # advisory with no patched version, which would otherwise block every
      # push over code that never reaches a user.
      - name: Audit dependencies (shipped)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dependencies (dev tooling, report only)
        run: npm audit --audit-level=high || true

      # No DATABASE_URL on purpose: the build must not depend on a live
      # database, or a Neon outage becomes a deploy outage.
      - name: Build
        run: npm run build

      # The Python side ships in the same deployment, so it is gated the same
      # way. No database here either: these are lint and type checks only.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install ".[dev]"

      - name: Lint Python
        run: ruff check api tests_py
